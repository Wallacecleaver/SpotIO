<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpotIO · Dashboard</title>
<link rel="icon" href="/logo.svg">
<style>
:root{--bg:#0b0d10;--card:#14181d;--line:#232a32;--tx:#e8edf2;--mut:#8b97a3;--ac:#3ddc97;--err:#ff6b6b;--warn:#f5b84b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:28px 16px 64px}
main{max-width:1000px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
header img{width:40px;height:40px;border-radius:10px}
h1{font-size:22px;margin:0;flex:1;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:28px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-size:26px;letter-spacing:-.02em}
.stat span{color:var(--mut);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
tr:last-child td{border-bottom:0}
td img{width:64px;height:36px;object-fit:cover;border-radius:6px;display:block}
a{color:var(--ac);text-decoration:none}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#3ddc9718;color:var(--ac)}
.tag.m{background:#f5b84b1c;color:var(--warn)}
button{background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.danger:hover{border-color:var(--err);color:var(--err)}
input{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:inherit;min-width:260px}
.login{max-width:380px;margin:20vh auto;text-align:center}
.login input{width:100%;margin:14px 0}
.empty{padding:22px;color:var(--mut);text-align:center}
.err-row{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.err-row:last-child{border:0}
.err-row time{color:var(--mut);margin-right:10px}
.mut{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let key = localStorage.getItem("spotio_admin") || "", timer;

async function call(path, opt = {}) {
  const r = await fetch(path, {...opt, headers: {"x-admin-key": key, "Content-Type": "application/json"}});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Erreur " + r.status);
  return j;
}
function login(msg = "") {
  clearInterval(timer);
  app.innerHTML = `<div class="login"><img src="/logo.svg" width="56" style="border-radius:14px"><h1 style="margin-top:14px">Dashboard SpotIO</h1>
  <input id="k" type="password" placeholder="Clé d’administration" autofocus><button id="go" style="width:100%;padding:11px">Se connecter</button>
  <p style="color:var(--err)">${esc(msg)}</p></div>`;
  const go = () => { key = document.getElementById("k").value; localStorage.setItem("spotio_admin", key); load(); };
  document.getElementById("go").onclick = go;
  document.getElementById("k").onkeydown = (e) => e.key === "Enter" && go();
}
const dur = (s) => s >= 86400 ? Math.floor(s/86400) + " j" : s >= 3600 ? Math.floor(s/3600) + " h" : Math.floor(s/60) + " min";
const ago = (t) => dur(Math.max(0, (Date.now() - t) / 1000)) ;

async function load() {
  let d;
  try { d = await call("/api/admin/stats"); } catch (e) { return login(e.message); }
  const c = d.counters, lookups = (c.hit || 0) + (c.miss || 0);
  const ratio = lookups ? Math.round(100 * (c.hit || 0) / lookups) + " %" : "–";
  const total = (c.catalog||0) + (c.meta||0) + (c.stream||0) + (c.manifest||0);
  app.innerHTML = `
  <header><img src="/logo.svg" alt=""><h1>SpotIO · Dashboard</h1>
    <button id="logout">Déconnexion</button></header>
  <div class="grid">
    <div class="stat"><b>${total}</b><span>Requêtes totales</span></div>
    <div class="stat"><b>${c.stream || 0}</b><span>Lectures demandées</span></div>
    <div class="stat"><b>${ratio}</b><span>Cache (hit ratio)</span></div>
    <div class="stat"><b>${c.fail || 0}</b><span>Matchs YouTube échoués</span></div>
    <div class="stat"><b>${c.direct_ok || 0}<small style="font-size:14px;color:var(--mut)"> / ${(c.direct_ok || 0) + (c.direct_fail || 0)}</small></b><span>Audio direct réussi</span></div>
    <div class="stat"><b>${d.cacheSize}</b><span>Titres en cache</span></div>
    <div class="stat"><b>${dur(d.uptime)}</b><span>Uptime</span></div>
  </div>
  <h2>Derniers matchs Spotify → YouTube</h2>
  <div class="panel scroll">${d.matches.length ? `<table><tr><th></th><th>Titre</th><th>Match</th><th>Score</th><th>Âge</th><th></th></tr>` +
    d.matches.map((m) => { const b = m.c[0]; return `<tr>
      <td><a href="https://youtu.be/${esc(b.id)}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${esc(b.id)}/mqdefault.jpg" alt="" loading="lazy"></a></td>
      <td><b>${esc(m.t.name)}</b><br><span class="mut">${esc(m.t.artists.join(", "))}</span></td>
      <td>${esc(b.title)}<br><span class="mut">${esc(b.channel)} · <span class="tag">${esc(m.pref)}</span></span></td>
      <td>${b.score}</td><td class="mut">${ago(m.at)}</td>
      <td><button data-fix="${esc(m.t.id)}">Corriger</button> <button class="danger" data-del="${esc(m.t.id)}">Reset</button></td></tr>`; }).join("") + "</table>"
    : `<div class="empty">Aucun match pour l’instant. Lance un titre dans Stremio.</div>`}</div>
  <h2>Corrections manuelles (${Object.keys(d.overrides).length})</h2>
  <div class="panel">${Object.keys(d.overrides).length ? Object.entries(d.overrides).map(([t, v]) =>
    `<div class="err-row"><span class="tag m">manuel</span> ${esc(t)} → <a href="https://youtu.be/${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>
    <button data-unfix="${esc(t)}" style="float:right">Retirer</button></div>`).join("") : `<div class="empty">Aucune.</div>`}</div>
  <h2>Sources audio (Piped / Invidious)</h2>
  <div class="panel">${[["Piped", d.instances.piped], ["Invidious", d.instances.invidious]].map(([n, a]) => `<div class="err-row"><b>${n}</b> · ${a.filter((i) => i.ok).length}/${a.length} saines<br><span class="mut">${a.map((i) => (i.ok ? "● " : "○ ") + esc(i.url.replace("https://", ""))).join("  ")}</span></div>`).join("")}</div>
  <h2>Erreurs récentes</h2>
  <div class="panel">${d.errors.length ? d.errors.map((e) => `<div class="err-row"><time>${new Date(e.at).toLocaleString("fr-FR")}</time>${esc(e.msg)}</div>`).join("") : `<div class="empty">Rien à signaler ✓</div>`}</div>
  <p style="margin-top:28px"><button class="danger" id="clear">Vider tout le cache</button></p>`;

  document.getElementById("logout").onclick = () => { localStorage.removeItem("spotio_admin"); key = ""; login(); };
  document.getElementById("clear").onclick = async () => { if (confirm("Vider le cache ?")) { await call("/api/admin/cache", {method:"DELETE"}); load(); } };
  app.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => { await call("/api/admin/cache?track=" + b.dataset.del, {method:"DELETE"}); load(); });
  app.querySelectorAll("[data-unfix]").forEach((b) => b.onclick = async () => { await call("/api/admin/override", {method:"POST", body: JSON.stringify({trackId: b.dataset.unfix, video: ""})}); load(); });
  app.querySelectorAll("[data-fix]").forEach((b) => b.onclick = async () => {
    const v = prompt("Lien ou ID de la vidéo YouTube à utiliser pour ce titre :");
    if (!v) return;
    try { await call("/api/admin/override", {method:"POST", body: JSON.stringify({trackId: b.dataset.fix, video: v})}); load(); } catch (e) { alert(e.message); }
  });
  clearInterval(timer); timer = setInterval(() => { if (!document.hidden && !document.querySelector("dialog")) load(); }, 15000);
}
key ? load() : login();
</script>
</body>
</html>
